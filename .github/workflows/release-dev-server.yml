name: Release Dev Server

# Triggered by version tags (e.g. 0.0.3, 0.0.3-dev) or manually.
# Builds the dev-server package for all three target platforms, runs the
# integration tests on each, then attaches the tarballs to an existing GitHub Release.
#
# Runner requirements:
#   - [self-hosted, linux, x86_64]    - existing CI runner
#   - linux on arm64 (GitHub-hosted)  - Apple Silicon
#   - macos-latest (GitHub-hosted)    - Apple Silicon

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. 0.0.3)'
        required: true

permissions:
  contents: read

jobs:
  build-package:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, linux, x86_64]
            platform: linux-x86_64
            os: linux
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            os: linux
          - runner: macos-latest
            platform: macos-arm64
            os: macos

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      OUTPUT_DIR: ${{ github.workspace }}/output
      BUILD_BUNDLED_EXTENSIONS: "1"

    steps:
      # harden-runner supports only GitHub-hosted runners; skip on self-hosted.
      - name: Harden the runner
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          path: source
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo source/scripts/setup_linux_build_env.sh

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: brew install bison cmake openssl

      - name: Cache Boost
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/boost
          key: boost-${{ runner.os }}-${{ runner.arch }}

      - name: Build and package dev server
        run: |
          mkdir -p "$BUILD_DIR" "$OUTPUT_DIR"

          EXTRA_FLAGS="-DDOWNLOAD_BOOST=1 -DWITH_BOOST=/tmp/boost"
          if [ "${{ matrix.os }}" = "macos" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_SSL=$(brew --prefix openssl)"
          fi

          BUILD_DIR="$BUILD_DIR" \
          OUTPUT_DIR="$OUTPUT_DIR" \
          CMAKE_EXTRA_FLAGS="$EXTRA_FLAGS" \
            source/scripts/make_villagesql_dev_server.sh

      - name: Run integration tests
        run: |
          TARBALL=$(ls "$OUTPUT_DIR"/*.tar.gz | head -1)
          TEST_DIR=$(mktemp -d)
          tar xzf "$TARBALL" -C "$TEST_DIR"
          PACKAGE_DIR=$(echo "$TEST_DIR"/villagesql-dev-server-*)
          source/villagesql/dev_server/tests/integration_test.sh "$PACKAGE_DIR"
          rm -rf "$TEST_DIR"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devserver-${{ matrix.platform }}
          path: ${{ env.OUTPUT_DIR }}/*.tar.gz

      - name: Upload SDK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-${{ matrix.platform }}
          path: ${{ env.BUILD_DIR }}/villagesql-extension-sdk-*.tar.gz

  attach-release-artifacts:
    name: Attach Release Artifacts
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: devserver-*
          merge-multiple: true
          path: packages/

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release upload "$TAG" packages/*.tar.gz --clobber
